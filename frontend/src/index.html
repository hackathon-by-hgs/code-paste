<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Sync</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <h1>Clipboard</h1>
            <div id="auth-status">
                <span id="user-email">Not logged in</span>
                <button id="btn-login" class="btn">Log In</button>
                <button id="btn-logout" class="btn hidden">Log Out</button>
            </div>
        </header>

        <main>
            <!-- Sync Status Section -->
            <section class="card" id="sync-section">
                <div class="card-header">
                    <h2>Sync Status</h2>
                    <label class="switch">
                        <input type="checkbox" id="toggle-sync" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                <p id="sync-description" class="status-text active">Sync is ON. Your clipboard will be synced across your devices.</p>
            </section>

            <!-- Device Management Section -->
            <section class="card" id="devices-section">
                <h2>My Devices</h2>
                <p class="subtitle">Devices that can receive your clipboard.</p>
                <ul id="device-list" class="list">
                    <!-- Populated by JS -->
                </ul>
                <button id="btn-add-device" class="btn secondary">Register New Device</button>
            </section>

            <!-- Sharing Section -->
            <section class="card" id="sharing-section">
                <h2>Sharing Session</h2>
                <div id="share-inactive" class="share-state">
                    <p>Not currently sharing with others.</p>
                    <button id="btn-start-share" class="btn primary">Start Sharing</button>
                    <button id="btn-join-share" class="btn secondary">Join Session</button>
                </div>
                
                <div id="share-active" class="share-state hidden">
                    <p class="status-text active">You are sharing clipboard data.</p>
                    <h3>Authorized Members:</h3>
                    <ul id="member-list" class="list">
                        <!-- Populated by JS -->
                    </ul>
                    <button id="btn-stop-share" class="btn danger">Stop Sharing</button>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
