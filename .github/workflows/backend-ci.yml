name: backend CI

# This workflow belongs to the `backend` branch and runs only for it. Each domain branch defines
# its own CI; there is no central workflow to coordinate (DEV_GUIDE.md §6).
#
# The filename is domain-scoped deliberately. GitHub keys a workflow by its FILE PATH, so every
# domain using `.github/workflows/ci.yml` collapses into one workflow record in the Actions UI and
# inherits whichever name was registered first — backend runs showed up as "Frontend CI". Naming
# the file per domain keeps the per-branch independence DEV_GUIDE.md §6 assumes.
on:
  push:
    branches: [backend, 'backend-*', 'feat/backend-*']
  pull_request:
    branches: [backend]

# Least privilege: no job here writes to the repo (GitHub Actions hardening guide). CodeQL, which
# needs security-events: write, lives in its own workflow (codeql.yml).
permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: format · lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Compiling is not the same as starting. tsc has exited 0 while emitting an artifact that
      # crashed on its first require, and every other gate stayed green because they all run
      # against src/. This boots dist/main.js and checks it serves.
      - run: npm run smoke

  test:
    name: tests (${{ matrix.driver }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The same suites run against both drivers. PGlite is what a developer gets with no
        # infrastructure; postgres is what production runs. Testing only one would let a
        # driver-specific behaviour difference reach production unnoticed (ADR-007).
        driver: [pglite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: code_paste_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # Synthetic. Never a real secret (TEST_STRATEGY.md, Test data rule).
      AUTH_JWT_SECRET: ci-only-synthetic-jwt-secret-value-0123456789abcdef
      DATABASE_URL: ${{ matrix.driver == 'postgres' && 'postgres://postgres:ci@localhost:5432/code_paste_test' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history plus tags: the contract pin resolves a tag on main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Pin contracts
        run: |
          git fetch origin --tags --force
          npm run contracts:pin

      - run: npm run test:unit
      - name: Contract conformance
        run: npm run test:contract
      - run: npm run test:integration
      - run: npm run test:security
      - run: npm run test:e2e

  docker:
    name: image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: code_paste_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # The contract pin lives at the branch root, outside this build context, so it is passed
        # in explicitly. Without it the running container reports contractsVersion "unknown".
        run: docker build --build-arg CONTRACTS_VERSION="$(cat ../CONTRACTS_VERSION)" -t code-paste-control-plane .

      # The runtime image prunes @electric-sql/pglite, which npm installs into production anyway
      # because drizzle-orm declares it as an optional peer. Both it and its Drizzle driver are
      # required lazily, so production never loads it — but only booting the pruned image proves
      # that, and this asserts the prune actually happened.
      - name: Assert pglite is not shipped
        run: |
          if docker run --rm --entrypoint sh code-paste-control-plane -c 'ls node_modules/@electric-sql' 2>/dev/null; then
            echo "::error::@electric-sql/pglite is present in the production image"
            exit 1
          fi
          echo "pglite correctly absent from the runtime image"

      - name: Run the image against PostgreSQL
        run: |
          KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          docker run -d --name control-plane --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=postgres://postgres:ci@127.0.0.1:5432/code_paste_ci \
            -e AUTH_JWT_SECRET=ci-only-synthetic-jwt-secret-value-0123456789abcdef \
            -e ROSTER_SIGNING_SECRET_KEY="$KEY" \
            code-paste-control-plane

      - name: Wait for health, then exercise the real device flow
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
          if ! [ -s /tmp/health.json ]; then
            echo "::error::image did not become healthy"
            exit 1
          fi
          echo "health:   $(cat /tmp/health.json)"
          # Proves migrations ran against real PostgreSQL inside the container, not against PGlite.
          grep -q '"driver":"postgres"' /tmp/health.json || { echo "::error::not using the postgres driver"; exit 1; }
          curl -fsS http://127.0.0.1:3000/v1/protocol > /tmp/protocol.json
          echo "protocol: $(cat /tmp/protocol.json)"
          # A deployed instance must report the contract it was built against, or drift between a
          # deployment and its contract is undetectable — which is the entire reason the field
          # exists. "unknown" means the pin never reached the image.
          PINNED=$(cat ../CONTRACTS_VERSION)
          grep -q "\"contractsVersion\":\"$PINNED\"" /tmp/protocol.json \
            || { echo "::error::image reports the wrong contract version (expected $PINNED)"; exit 1; }
          # A signup exercises the schema the startup migrations just created, so a broken or
          # partially-applied migration fails here rather than on a user's first request.
          curl -fsS -X POST http://127.0.0.1:3000/v1/auth/signup \
            -H 'content-type: application/json' \
            -d '{"email":"ci-image-check@example.test","password":"synthetic-ci-password"}' \
            -o /tmp/signup.json
          grep -q '"accessToken"' /tmp/signup.json || { echo "::error::signup against the image failed"; exit 1; }
          echo "signup:   ok"

      - name: Container logs
        if: always()
        run: docker logs control-plane || true

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Production dependencies only: a dev-time advisory should not block a release, but a
      # shipped one must (SPEC_CONTRACT.md §15.3).
      - run: npm run audit:security

  no-secrets:
    name: no secrets committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed .env files and key material
        run: |
          # DEV_GUIDE.md §9: never commit .env, tokens, private keys or device keys.
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$'; then
            echo "::error::A .env file is tracked. Only .env.example may be committed."
            exit 1
          fi
          # Docs and specs are excluded: the log-redaction test legitimately contains a PEM header
          # as a fixture, to prove the scrubber removes it. Real key material would not live in a
          # spec file, and a check that cries wolf on its own test is a check the next person
          # in a hurry deletes.
          if git grep -lE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' -- . ':!*.md' ':!*.spec.ts'; then
            echo "::error::Private key material found in tracked files."
            exit 1
          fi
          echo "No committed secrets found."

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            build
            perf
            revert
          scopes: |
            backend
            auth
            devices
            sharing
            protocol
            persistence
            deps
            deps-dev
            security
          requireScope: false
