name: Mobile CI

# Belongs to the `mobile` branch only (DEV_GUIDE.md §6). Flutter / Dart, Android + iOS.

on:
  push:
    branches: [mobile]
  pull_request:
    branches: [mobile]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: mobile
    shell: bash

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - name: Unit & widget tests (with coverage)
        run: flutter test --no-pub --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  contract-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned contracts
        working-directory: .
        run: |
          contract_ref="$(cat CONTRACTS_VERSION)"
          git fetch origin "$contract_ref" --depth=1
          mkdir -p .contracts
          git archive FETCH_HEAD contracts | tar -x -C .contracts
      - name: Report conformance implementation status
        run: echo '::notice::Pinned contracts fetched. Contract vector tests are not implemented yet.'

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            build
            perf
            revert
          scopes: |
            mobile
            android
            ios
            clipboard
            deps
            deps-dev
          requireScope: false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APKs by architecture
        run: flutter build apk --release --split-per-abi --build-number "$GITHUB_RUN_NUMBER"
      - name: Prepare APK downloads
        run: |
          mkdir -p release-apks
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              "release-apks/copy-and-paste-$abi.apk"
          done
          cd release-apks
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: mobile/release-apks/
          if-no-files-found: error
          retention-days: 14

  build-ios:
    # iOS runs on macOS runners, which bill ~10× the minutes. Compile-only (no signing) as a
    # regression check, and only on push to `mobile` (not on every PR) to keep PRs fast and cheap.
    # Not a required merge gate.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mobile'
    needs: [checks, contract-conformance, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-apks
      - name: Publish APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: mobile-build-${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<EOF_NOTES
          Automated Android test build from commit $RELEASE_COMMIT.

          Download one APK for your device:
          - arm64-v8a: most current Android phones.
          - armeabi-v7a: older 32-bit ARM devices.
          - x86_64: Intel/AMD Android devices and emulators.

          These APKs use the project's current debug signing configuration.
          Signing keys can change between CI runs, so reinstalling may be needed.
          SHA256SUMS.txt contains download checksums.
          EOF_NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-apks/* --clobber
          else
            gh release create "$RELEASE_TAG" release-apks/* \
              --target "$RELEASE_COMMIT" \
              --title "Copy & Paste Android build $GITHUB_RUN_NUMBER" \
              --notes-file release-notes.md \
              --prerelease
          fi
