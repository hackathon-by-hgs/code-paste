name: CodeQL

# Static security analysis for the control plane. Its own workflow (not a required merge gate) so a
# repo without code scanning enabled cannot deadlock merges. Free on public repos; needs GitHub
# Advanced Security on private repos. Enable in Settings → Security → Code scanning.

on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: backend-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
